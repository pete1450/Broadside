name: build
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: logic tests
        run: node build/test_logic.js
      - name: rebuild single-file bundle
        run: python3 build/build.py
      - name: commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html music.json
          git diff --cached --quiet || git commit -m "rebuild index.html + music.json [skip ci]"
          git push
